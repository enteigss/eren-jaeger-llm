model:
  base_model: "meta-llama/Llama-2-7b-chat-hf"
  max_length: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50

training:
  batch_size: 8
  learning_rate: 2e-5
  num_epochs: 3
  warmup_steps: 100
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["q_proj", "v_proj"]

data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_samples: 10000

logging:
  wandb_project: "eren-llm"
  log_steps: 100
  eval_steps: 500
  save_steps: 1000 